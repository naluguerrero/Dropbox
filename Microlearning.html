<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Share with Intent — Interactive Microlearning</title>
<style>
:root{--ink:#17202a;--muted:#64748b;--line:#d9e1ea;--panel:#f6f8fb;--card:#fff;--accent:#2f6fed;--ok:#13795b;--bad:#b5473c}
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.5}
main{max-width:1050px;margin:28px auto;padding:0 18px}.shell{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,44px);box-shadow:0 16px 40px rgba(15,23,42,.08)}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.progress-label{font-size:13px;color:var(--muted)}
.track{height:6px;background:#e6ebf1;border-radius:99px;overflow:hidden;margin:14px 0 30px}.bar{height:100%;background:var(--accent);transition:width .3s ease}
h1,h2,h3{line-height:1.15}h1{font-size:clamp(32px,5vw,54px);margin:4px 0 12px}h2{font-size:clamp(26px,4vw,38px);margin:4px 0 14px}h3{font-size:20px}.lead{font-size:18px;max-width:760px}.muted{color:var(--muted)}
.grid{display:grid;gap:14px}.tools{grid-template-columns:repeat(4,1fr);margin:22px 0}.choices{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}
.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--card)}.icon{font-size:26px}.card strong{display:block;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:20px 0}
button{font:inherit}.primary,.choice{min-height:48px;border-radius:13px;cursor:pointer}.primary{border:0;background:var(--accent);color:#fff;padding:12px 19px;font-weight:800}.choice{background:#fff;border:1px solid var(--line);padding:16px;text-align:left;color:var(--ink)}.choice:hover,.choice:focus{border-color:var(--accent);outline:3px solid rgba(47,111,237,.13)}.choice span{display:block}.choice .name{font-weight:800;margin-top:3px}.choice .desc{font-size:13px;color:var(--muted)}
.feedback{border-left:5px solid var(--ok)}.feedback.bad{border-left-color:var(--bad)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.safety{display:grid;gap:12px}.safety .card strong{display:inline}.smallcaps{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
@media(max-width:760px){.tools,.choices,.three{grid-template-columns:1fr}.top{align-items:flex-start}.shell{border-radius:18px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main><div class="shell">
<div class="top"><div id="eyebrow" class="eyebrow">Microlearning • Tier 1 agents</div><div id="progressLabel" class="progress-label">Introduction</div></div>
<div class="track"><div id="progress" class="bar" style="width:8%"></div></div>
<section id="screen" aria-live="polite"></section>
</div></main>
<script>
const screen=document.getElementById('screen'),progress=document.getElementById('progress'),progressLabel=document.getElementById('progressLabel'),eyebrow=document.getElementById('eyebrow');
const methods=[['🔗','Shared Links','Send a view'],['📁','Shared Folders','Work together'],['📤','Transfer','Deliver a package'],['📥','File Request','Collect from others']];
const scenarios=[
{person:'Maya • Events lead',title:'A vendor needs the latest event brief',body:'Maya has a one-page event brief ready. She wants an outside print vendor to view the latest version, but the vendor should not edit the file or browse the rest of her team’s work.',think:'Think: quick access, one destination, no collaboration needed.',correct:0,answer:'SHARED LINKS',good:'A Shared Link is the cleanest choice when someone needs to open a specific file or folder without joining an ongoing workspace. Maya can share the brief without inviting the vendor into her team’s files.',bad:'That option would create more access or collaboration than Maya needs. Start by asking whether the recipient needs to work in the files, simply download a finished package, or upload files back.',others:[['📁 Shared Folders','Best when the vendor needs ongoing access and collaboration across multiple files.'],['📤 Transfer','Best when Maya is delivering a finished, downloadable bundle rather than a live brief.'],['📥 File Request','Best when Maya needs the vendor to upload files back to her.']]},
{person:'David • Product Manager',title:'A launch team needs one working space',body:'David’s four-person launch team is revising briefs, screenshots, and a launch checklist over the next six weeks. Everyone needs to see updates and add or edit files as the work evolves.',think:'Think: shared workspace, recurring access, work in progress.',correct:1,answer:'',good:'A Shared Folder is designed for ongoing collaboration. David can invite the team into one shared space so members can access the working files and keep updates together.',bad:'The choice you made is better for a one-time view, a finished handoff, or collecting uploads. David’s team needs a durable workspace where invited collaborators can work with the files.',others:[['🔗 Shared Links','Best when people only need to view or download a specific file or folder.'],['📤 Transfer','Best when David has a final package to deliver, not a project to keep editing.'],['📥 File Request','Best when David wants others to send files in without accessing the workspace.']]},
{person:'Amy • Video Producer',title:'A client needs the finished video package',body:'Amy has finished a 1.2 GB campaign video and its caption files. The external client only needs to download the final package; they do not need access to Amy’s Dropbox or a place to collaborate.',think:'Think: finished files, one handoff, recipient downloads.',correct:2,answer:'',good:'Transfer is built for delivering finished files for download. It keeps the handoff separate from Amy’s working Dropbox content and avoids setting up an ongoing collaborative space.',bad:'That option is not the best fit for a one-time delivery of a finished package. Ask whether the recipient needs a live workspace or simply needs to download what is complete.',others:[['🔗 Shared Links','Best for a lightweight link to a file when neither collaboration nor a transfer-style handoff is needed.'],['📁 Shared Folders','Best when the client needs to collaborate or keep accessing evolving files.'],['📥 File Request','Best when Amy needs the client to upload source files or feedback materials.']]},
{person:'Kellie • People operations',title:'HR needs receipts from the whole team',body:'Kellie needs expense receipts from 30 employees. Each employee should be able to upload their files, but employees should not see one another’s receipts or get access to the destination folder.',think:'Think: collect uploads, keep the destination private.',correct:3,answer:'',good:'A File Request lets Kellie collect files from many people into a Dropbox folder without sharing the folder’s existing contents with uploaders. That matches a private, one-way collection workflow.',bad:'That option would either expose a workspace, deliver files outward, or give access to content that should stay private. Kellie’s key need is collecting uploads without sharing the destination.',others:[['🔗 Shared Links','Best when Kellie wants people to open or download something she has already prepared.'],['📁 Shared Folders','Best when the group should see and work with the same folder contents.'],['📤 Transfer','Best when Kellie is sending a finished package out, not collecting files in.']]}
];
function setProgress(label,pct){progressLabel.textContent=label;progress.style.width=pct+'%'}
function primary(text,id='next'){return `<button class="primary" id="${id}" type="button">${text}</button>`}
function intro(){eyebrow.textContent='Microlearning • Tier 1 agents';setProgress('Introduction',8);screen.innerHTML=`<div class="smallcaps">Share with Intent</div><h1>choose the right tool</h1><p class="lead">This lesson will help Tier 1 agents match customer needs to the correct Dropbox file-sharing method.</p><div class="panel"><strong>By the end</strong><ol><li>Spot the customer’s sharing needs</li><li>Match it to the right Dropbox method</li><li>Explain the recommendation cleaarly</li></ol></div><div class="grid tools">${methods.map(m=>`<div class="card"><div class="icon">${m[0]}</div><strong>${m[1]}</strong><div class="muted">${m[2]}</div></div>`).join('')}</div>${primary('Start microlearning →')}`;document.getElementById('next').onclick=()=>scenario(0)}
function scenario(i){const s=scenarios[i];eyebrow.textContent='Read the moment. Make the call.';setProgress(`Scenario ${i+1} of 4`,20+i*18);screen.innerHTML=`<div class="smallcaps">Customer moment</div><div><strong>${s.person}</strong></div><h2>${s.title}</h2><p class="lead">${s.body}</p><div class="panel"><div class="smallcaps">Your call</div><h3>Which sharing method best fits ${s.person.split(' • ')[0]}’s request?</h3><p class="muted">${s.think}</p><div class="grid choices">${methods.map((m,j)=>`<button class="choice" type="button" data-choice="${j}"><span class="icon">${m[0]}</span><span class="name">${m[1]}</span><span class="desc">${m[2]}</span></button>`).join('')}</div></div>`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>feedback(i,+b.dataset.choice))}
function feedback(i,c){const s=scenarios[i],ok=c===s.correct;eyebrow.textContent=ok?'Correct answer':'Try again';screen.innerHTML=`<div class="panel feedback ${ok?'':'bad'}"><div class="smallcaps">${ok?'CORRECT ANSWER:':'Not quite — use the customer’s cue.'}</div>${ok&&s.answer?`<h2>${s.answer}</h2>`:''}${ok?'<h3>Nice call.</h3>':''}<p>${ok?s.good:s.bad}</p></div><h3>See when the other methods fit</h3><div class="grid three">${s.others.map(x=>`<div class="card"><strong>${x[0]}</strong><div class="muted">${x[1]}</div></div>`).join('')}</div><div class="actions">${ok?primary(i<3?'Continue →':'Review the workflow →'):primary('Choose another option to continue.','retry')}</div>`;if(ok)document.getElementById('next').onclick=()=>i<3?scenario(i+1):recap();else document.getElementById('retry').onclick=()=>scenario(i)}
function recap(){eyebrow.textContent='Take away';setProgress('Workflow recap',92);screen.innerHTML=`<h2>Choose by Workflow</h2><p>When the customer describes the outcome the need, use this table to make the recommendation quickly</p><div class="grid tools">${methods.map(m=>`<div class="card"><div class="icon">${m[0]}</div><strong>${m[1]}</strong><div class="muted">${m[2]}</div></div>`).join('')}</div>${primary('Continue to sharing safety →')}`;document.getElementById('next').onclick=safety}
function safety(){eyebrow.textContent='External Sharing Safety';setProgress('Complete',100);screen.innerHTML=`<h2>🔐 External Sharing Safety</h2><h3>Share smart: Protect the data</h3><p>Sharing files externally comes with a heightened level of risk. Protect the data with these four steps:</p><div class="safety"><div class="card"><strong>Share only what’s needed:</strong> give only access to the specific files or folders they need</div><div class="card"><strong>Choose the level of access:</strong> use “Can view” instead of “Can edit” when editing is not required</div><div class="card"><strong>When available, add protection:</strong> consider passwords, expiration date and other access restrictions before sending, when available.</div><div class="card"><strong>Review access:</strong> remove people’s access or disable the link if no longer needed</div></div><div class="actions"><strong>Microlearning complete.</strong>${primary('Restart','restart')}</div>`;document.getElementById('restart').onclick=intro}
intro();
</script>
</body>
</html>
